name: Metabase
tagline: Business intelligence and dashboards anyone on your team can use
category: analytics
tags: [bi, dashboards, sql, reporting]
maintainer: Unbroker
official: true
links:
  website: https://www.metabase.com
  source: https://github.com/metabase/metabase
  docs: https://www.metabase.com/docs/latest/

variables:
  ADMIN_EMAIL:
    description: Email of the first admin account. You sign in with it.
  ADMIN_PASSWORD:
    description: Password for that account. Metabase requires at least 15 characters and rejects common passwords.

services:
  db:
    preset: postgres
    env:
      POSTGRES_DB: metabase

  metabase:
    name: Metabase
    image: metabase/metabase:v0.64.2.3
    port: 3000
    public: true
    healthcheck: /api/health
    # A JVM: under the 256 MiB default its heap is ~120 MB and it crash-loops.
    # With 1.5 GB and the heap at 70% of it, Metabase boots in time and has room
    # to run queries.
    resources:
      memoryMiB: 1536
      cpuMillicores: 1000
    # Database drivers Metabase unpacks on boot, and the native libraries they
    # load (/tmp is noexec). Questions, dashboards and users live in Postgres.
    volume:
      path: /data
      sizeGb: 1
    # A fresh Metabase lets whoever reaches it first create the admin, so on
    # first boot it runs on an internal address (127.0.0.1:3999, never routed),
    # setup is completed there with ADMIN_EMAIL and ADMIN_PASSWORD, and only then
    # does the real server start on the public port. A marker on the volume
    # skips this afterwards. If Metabase rejects the values, boot stops before
    # the public port opens.
    startCommand: >-
      mkdir -p /data/plugins /data/native &&
      if [ ! -f /data/.unbroker-setup-done ]; then
      echo 'Completing Metabase setup before opening the public port...';
      ( MB_JETTY_PORT=3999 MB_JETTY_HOST=127.0.0.1 exec /app/run_metabase.sh ) & mb=$!; u=http://127.0.0.1:3999;
      n=0; until p=$(curl -sf -m 10 $u/api/session/properties); do kill -0 $mb 2>/dev/null || { echo 'Metabase exited before it was ready'; exit 1; };
      n=$((n+1)); [ $n -lt 240 ] || { echo 'Metabase did not answer on its internal port within 8 minutes. Is the service short on memory or CPU?'; kill -9 $mb; exit 1; };
      [ $((n % 15)) -ne 0 ] || echo "Still waiting for the internal Metabase ($((n*2))s)..."; sleep 2; done; echo "Internal Metabase ready after $((n*2))s";
      t=$(printf %s "$p" | sed -n 's/.*"setup-token":"\([^"]*\)".*/\1/p');
      if [ -n "$t" ]; then
      esc() { printf %s "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; };
      b="{\"token\":\"$t\",\"user\":{\"email\":\"$(esc "$ADMIN_EMAIL")\",\"password\":\"$(esc "$ADMIN_PASSWORD")\",\"first_name\":\"Admin\"},\"prefs\":{\"site_name\":\"Metabase\"}}";
      r=$(curl -s -m 120 -o /tmp/mb-setup.json -w '%{http_code}' -H 'Content-Type: application/json' -d "$b" $u/api/setup);
      if [ "$r" != 200 ]; then echo "Metabase setup failed ($r):"; cat /tmp/mb-setup.json; echo; kill $mb; exit 1; fi;
      fi;
      touch /data/.unbroker-setup-done; kill $mb; wait $mb; echo 'Metabase admin ready';
      fi &&
      exec /app/run_metabase.sh
    env:
      MB_DB_TYPE: postgres
      MB_DB_HOST: ${{services.db.host}}
      MB_DB_PORT: ${{services.db.port}}
      MB_DB_DBNAME: metabase
      MB_DB_USER: postgres
      MB_DB_PASS: ${{services.db.env.POSTGRES_PASSWORD}}
      # Encrypts the connection details of every database you add. Generated
      # once; losing it makes them unreadable.
      MB_ENCRYPTION_SECRET_KEY: ${{secret(48)}}
      MB_SITE_URL: ${{services.metabase.url}}
      MB_PLUGINS_DIR: /data/plugins
      # The SQLite driver (the sample database) unpacks a native library before
      # loading it; /tmp is mounted noexec.
      JAVA_OPTS: -Dorg.sqlite.tmpdir=/data/native -XX:MaxRAMPercentage=70
      MB_JETTY_PORT: "3000"
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      ADMIN_EMAIL: ${{vars.ADMIN_EMAIL}}
      ADMIN_PASSWORD: ${{vars.ADMIN_PASSWORD}}
