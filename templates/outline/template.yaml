name: Outline
tagline: Fast, collaborative knowledge base and wiki for your team
category: productivity
tags: [wiki, docs, knowledge-base, notion]
maintainer: Unbroker
official: true
links:
  website: https://www.getoutline.com
  source: https://github.com/outline/outline
  docs: https://docs.getoutline.com/s/hosting

# Outline signs people in with a link sent by email, so it needs an SMTP server
# (any transactional email provider works: Resend, Postmark, SES, Mailgun…).
variables:
  ADMIN_EMAIL:
    description: Email of the first admin. You sign in with a link sent to this address.
    pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    patternMessage: 'must be an email address, like you@example.com'
  ADMIN_NAME:
    description: Name shown for that admin.
    default: Admin
  WORKSPACE_NAME:
    description: Name of the workspace.
    default: Wiki
  SMTP_HOST:
    description: SMTP server that sends the sign-in emails, e.g. smtp.resend.com.
  SMTP_PORT:
    description: SMTP port. 587 (STARTTLS) or 465 (TLS).
    default: "587"
    pattern: '^[0-9]{1,5}$'
    patternMessage: 'must be a port number, like 587'
  SMTP_SECURE:
    description: '"true" for port 465 (TLS from the start), "false" for 587 (STARTTLS).'
    default: "false"
    pattern: '^(true|false)$'
    patternMessage: 'must be true or false'
  SMTP_USERNAME:
    description: SMTP username. Leave empty if the server needs no authentication.
    required: false
  SMTP_PASSWORD:
    description: SMTP password or API key.
    required: false
  SMTP_FROM_EMAIL:
    description: Sender of the sign-in emails, e.g. Outline <wiki@yourdomain.com>. The domain must be verified with your provider.
    pattern: '^([^<>]*<[^@\s<>]+@[^@\s<>]+\.[^@\s<>]+>|[^@\s<>]+@[^@\s<>]+\.[^@\s<>]+)$'
    patternMessage: 'must be an email address, optionally with a name: Outline <wiki@yourdomain.com>'

services:
  db:
    preset: postgres
    env:
      POSTGRES_DB: outline

  redis:
    preset: redis

  outline:
    name: Outline
    image: outlinewiki/outline:1.11.0
    port: 3000
    public: true
    healthcheck: /_health
    # Web, collaboration and workers run in one Node process; it doesn't become
    # healthy under the 256 MiB default. A full CPU so the first boot (migrations
    # and workspace on the internal port, then the public server) fits the 180 s
    # rollout window.
    resources:
      memoryMiB: 1024
      cpuMillicores: 1000
    # Uploaded images and attachments. Documents live in Postgres.
    volume:
      path: /var/lib/outline/data
      sizeGb: 5
    # Outline wants SECRET_KEY as 64 hex characters; it is derived from a
    # generated secret. A fresh Outline also lets whoever reaches it first create
    # the workspace (installation.create), so while the database has no team,
    # boot first runs Outline on an internal port (3999, which the platform never
    # routes to), creates the workspace there with WORKSPACE_NAME and
    # ADMIN_EMAIL, stops it, and only then starts the real server on the public
    # port. If Outline rejects the values, boot stops before that port opens.
    startCommand: >-
      export SECRET_KEY=$(printf %s "$SECRET_SEED" | sha256sum | cut -c1-64) &&
      node -e 'const {spawn}=require("child_process"),e=process.env,u="http://127.0.0.1:3999",sleep=t=>new Promise(r=>setTimeout(r,t));(async()=>{let n=0;try{const c=new (require("pg").Client)({connectionString:e.DATABASE_URL});await c.connect();n=+(await c.query("select count(*) from teams")).rows[0].count;await c.end()}catch{}if(n>0)process.exit(0);console.log("Creating the Outline workspace before opening the public port...");const p=spawn("node",["build/server/index.js"],{env:{...e,PORT:"3999"},stdio:"inherit",detached:true});let gone=false;p.on("exit",()=>gone=true);const t0=Date.now(),secs=()=>Math.round((Date.now()-t0)/1000);for(let i=1;;i++){if(gone){console.log("Outline exited before it was ready");process.exit(1)}if(secs()>480){console.log("Outline did not answer on its internal port within 8 minutes. Is the service short on memory or CPU?");try{process.kill(-p.pid,"SIGKILL")}catch{}process.exit(1)}if(i%15==0)console.log("Still waiting for the internal Outline ("+secs()+"s)...");try{if((await fetch(u+"/_health",{signal:AbortSignal.timeout(10000)})).ok)break}catch{}await sleep(1000)}console.log("Internal Outline ready after "+secs()+"s");const r=await fetch(u+"/api/installation.create",{method:"POST",redirect:"manual",signal:AbortSignal.timeout(60000),headers:{"content-type":"application/json"},body:JSON.stringify({teamName:e.WORKSPACE_NAME,userName:e.ADMIN_NAME,userEmail:e.ADMIN_EMAIL})}),t=await r.text();process.kill(-p.pid,"SIGTERM");for(let i=0;i<30&&!gone;i++)await sleep(1000);try{process.kill(-p.pid,"SIGKILL")}catch{}if(r.status>=400&&!t.includes("existing teams")){console.log("Outline setup failed ("+r.status+"): "+t);process.exit(1)}console.log("Outline workspace created for "+e.ADMIN_EMAIL);process.exit(0)})()' &&
      exec node build/server/index.js
    env:
      URL: ${{services.outline.url}}
      DATABASE_URL: postgres://postgres:${{services.db.env.POSTGRES_PASSWORD}}@${{services.db.host}}:${{services.db.port}}/outline
      PGSSLMODE: disable
      REDIS_URL: redis://:${{services.redis.env.REDIS_PASSWORD}}@${{services.redis.host}}:${{services.redis.port}}
      SECRET_SEED: ${{secret(64)}}
      UTILS_SECRET: ${{secret(64)}}
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      # HTTPS is terminated by Unbroker Cloud in front of the app.
      FORCE_HTTPS: "false"
      SMTP_HOST: ${{vars.SMTP_HOST}}
      SMTP_PORT: ${{vars.SMTP_PORT}}
      SMTP_SECURE: ${{vars.SMTP_SECURE}}
      SMTP_USERNAME: ${{vars.SMTP_USERNAME}}
      SMTP_PASSWORD: ${{vars.SMTP_PASSWORD}}
      SMTP_FROM_EMAIL: ${{vars.SMTP_FROM_EMAIL}}
      ADMIN_EMAIL: ${{vars.ADMIN_EMAIL}}
      ADMIN_NAME: ${{vars.ADMIN_NAME}}
      WORKSPACE_NAME: ${{vars.WORKSPACE_NAME}}
