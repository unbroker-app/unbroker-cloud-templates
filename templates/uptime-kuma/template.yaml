name: Uptime Kuma
tagline: Self-hosted uptime monitoring with status pages and alerts
category: monitoring
tags: [uptime, monitoring, status-page, alerts]
maintainer: Unbroker
official: true
links:
  website: https://uptime.kuma.pet
  source: https://github.com/louislam/uptime-kuma
  docs: https://github.com/louislam/uptime-kuma/wiki

services:
  uptime-kuma:
    name: Uptime Kuma
    image: louislam/uptime-kuma:2.5.6
    port: 3001
    public: true
    # Monitors, history and settings (SQLite) live here.
    volume:
      path: /data
      sizeGb: 1
    env:
      DATA_DIR: /data/
      UPTIME_KUMA_PORT: "3001"
