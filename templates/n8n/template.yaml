name: n8n
tagline: Workflow automation with 400+ integrations and AI agents
category: automation
tags: [workflows, automation, ai, integrations]
maintainer: Unbroker
official: true
links:
  website: https://n8n.io
  source: https://github.com/n8n-io/n8n
  docs: https://docs.n8n.io/hosting/

variables:
  TIMEZONE:
    description: Timezone schedule triggers run in, e.g. America/Argentina/Buenos_Aires.
    required: false
    default: UTC

services:
  db:
    preset: postgres
    env:
      POSTGRES_DB: n8n

  n8n:
    name: n8n
    image: n8nio/n8n:2.44.1
    port: 5678
    public: true
    healthcheck: /healthz
    # Under the 256 MiB default n8n crash-loops ("Last session crashed") before
    # it ever answers.
    resources:
      memoryMiB: 1024
      cpuMillicores: 500
    # Credentials files, the instance id and community nodes. Workflows and
    # executions live in Postgres.
    volume:
      path: /data
      sizeGb: 1
    env:
      N8N_USER_FOLDER: /data
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${{services.db.host}}
      DB_POSTGRESDB_PORT: ${{services.db.port}}
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: ${{services.db.env.POSTGRES_PASSWORD}}
      # Encrypts every stored credential. Generated once; losing it makes them unreadable.
      N8N_ENCRYPTION_KEY: ${{secret(48)}}
      N8N_PORT: "5678"
      WEBHOOK_URL: ${{services.n8n.url}}
      N8N_EDITOR_BASE_URL: ${{services.n8n.url}}
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: ${{vars.TIMEZONE}}
      TZ: ${{vars.TIMEZONE}}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
