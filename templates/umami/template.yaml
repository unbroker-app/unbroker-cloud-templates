name: Umami
tagline: Simple, privacy-focused web analytics, a Google Analytics alternative
category: analytics
tags: [analytics, privacy, web, gdpr]
maintainer: Unbroker
official: true
links:
  website: https://umami.is
  source: https://github.com/umami-software/umami
  docs: https://umami.is/docs

variables:
  ADMIN_PASSWORD:
    description: Password for the admin account (at least 8 characters). It replaces Umami's default password on first boot.

services:
  db:
    preset: postgres
    env:
      POSTGRES_DB: umami

  umami:
    name: Umami
    image: ghcr.io/umami-software/umami:3.4.0
    port: 3000
    public: true
    healthcheck: /api/heartbeat
    # Next.js plus a Prisma migration at boot; under the 256 MiB default it
    # restarts mid-run.
    resources:
      memoryMiB: 512
      cpuMillicores: 500
    # Umami seeds an admin/umami account and has no setting to change it. While
    # the admin still has that default password, boot first runs Umami on an
    # internal address (127.0.0.1:3999, never routed), sets ADMIN_PASSWORD
    # through Umami's own API there, stops it, and only then starts the public
    # server. If Umami rejects the password, boot stops before that port opens.
    startCommand: >-
      export PATH="$PWD/node_modules/.bin:$PATH" && node scripts/check-db.js &&
      node -e "$BOOTSTRAP_JS" &&
      exec node server.js
    env:
      # The first-boot script above, kept here because a start command is
      # limited to 2000 characters.
      BOOTSTRAP_JS: 'const e=process.env,{spawn}=require("child_process"),sleep=t=>new Promise(r=>setTimeout(r,t)),u="http://127.0.0.1:3999",post=(p,b,t)=>fetch(u+p,{method:"POST",signal:AbortSignal.timeout(60000),headers:Object.assign({"content-type":"application/json"},t?{authorization:"Bearer "+t}:{}),body:JSON.stringify(b)});(async()=>{const pg=require("module").createRequire(require.resolve("@prisma/adapter-pg"))("pg"),c=new pg.Client({connectionString:e.DATABASE_URL});await c.connect();const {rows}=await c.query("select password from \"user\" where username=$1",["admin"]);await c.end();if(!rows.length||rows[0].password!=="$2b$10$BUli0c.muyCW1ErNJc3jL.vFRFtFJWrT8/GcR4A.sUdCznaXiqFXa")process.exit(0);console.log("Replacing the default admin password before opening the public port...");const p=spawn("node",["server.js"],{env:{...e,PORT:"3999",HOSTNAME:"127.0.0.1"},stdio:"inherit",detached:true});let gone=false;p.on("exit",()=>gone=true);const t0=Date.now(),secs=()=>Math.round((Date.now()-t0)/1000);for(let i=1;;i++){if(gone){console.log("Umami exited before it was ready");process.exit(1)}if(secs()>480){console.log("Umami did not answer on its internal port within 8 minutes. Is the service short on memory or CPU?");try{process.kill(-p.pid,"SIGKILL")}catch{}process.exit(1)}if(i%30==0)console.log("Still waiting for the internal Umami ("+secs()+"s)...");try{if((await fetch(u+"/api/heartbeat",{signal:AbortSignal.timeout(10000)})).ok)break}catch{}await sleep(500)}console.log("Internal Umami ready after "+secs()+"s");const r=await post("/api/auth/login",{username:"admin",password:"umami"}),tok=r.ok?(await r.json()).token:null,ch=tok?await post("/api/me/password",{currentPassword:"umami",newPassword:e.ADMIN_PASSWORD},tok):r;const ok=ch.ok,why=ok?"":ch.status+" "+await ch.text();process.kill(-p.pid,"SIGTERM");for(let i=0;i<20&&!gone;i++)await sleep(500);if(!ok){console.log("Could not set the admin password: "+why);process.exit(1)}console.log("Admin password set from ADMIN_PASSWORD");process.exit(0)})()'
      DATABASE_URL: postgresql://postgres:${{services.db.env.POSTGRES_PASSWORD}}@${{services.db.host}}:${{services.db.port}}/umami
      APP_SECRET: ${{secret(48)}}
      ADMIN_PASSWORD: ${{vars.ADMIN_PASSWORD}}
      DISABLE_TELEMETRY: "1"
